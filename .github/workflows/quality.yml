name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Verify scaffold
        run: npm run verify:scaffold

      - name: Verify environment contract
        run: npm run verify:env

      - name: Verify Supabase baseline
        run: npm run verify:supabase

      - name: Verify Auth and membership contract
        run: npm run verify:auth

      - name: Verify observability contract
        run: npm run verify:observability

      - name: Verify shared archive contract
        run: npm run verify:shared-archive

      - name: Verify contact boundary contract
        run: npm run verify:contacts

      - name: Verify credential-safe CI failure path
        run: npm run verify:ci-credential-suppression

      - name: Start local Supabase
        shell: bash
        run: |
          set +x
          start_log="$RUNNER_TEMP/canwin-supabase-start.log"
          cleanup_supabase_start() {
            rm -f -- "$start_log"
          }
          trap cleanup_supabase_start EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          install -m 600 /dev/null "$start_log"
          if npx supabase start >"$start_log" 2>&1; then
            printf '%s\n' 'Local Supabase started.'
          else
            start_status=$?
            printf 'Local Supabase startup failed (exit %s); raw output withheld because it may contain temporary credentials.\n' "$start_status" >&2
            exit "$start_status"
          fi

      - name: Test database policies and Auth contract
        run: npx supabase test db --local

      - name: Verify real Auth sessions
        shell: bash
        run: |
          set +x
          status_log="$RUNNER_TEMP/canwin-supabase-status.log"
          function_env="$RUNNER_TEMP/canwin-functions.env"
          edge_log="$RUNNER_TEMP/canwin-edge.log"
          edge_pid=""
          cleanup() {
            if [[ -n "$edge_pid" ]]; then
              kill "$edge_pid" 2>/dev/null || true
              wait "$edge_pid" 2>/dev/null || true
            fi
            rm -f -- "$status_log" "$function_env" "$edge_log"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          install -m 600 /dev/null "$status_log"
          install -m 600 /dev/null "$function_env"
          install -m 600 /dev/null "$edge_log"
          if ! status_json="$(npx supabase status -o json 2>"$status_log")"; then
            printf '%s\n' 'Local Supabase status failed; raw output withheld because it may contain temporary credentials.' >&2
            exit 1
          fi
          export CANWIN_TEST_API_URL="$(jq -r '.API_URL' <<<"$status_json")"
          export CANWIN_TEST_PUBLISHABLE_KEY="$(jq -r '.PUBLISHABLE_KEY' <<<"$status_json")"
          if ! read -r CANWIN_TEST_SECRET_KEY < <(jq -er '.SECRET_KEY' <<<"$status_json" 2>>"$status_log"); then
            printf '%s\n' 'Local Supabase credentials could not be read; raw output withheld.' >&2
            exit 1
          fi
          export CANWIN_TEST_SECRET_KEY
          printf '::add-mask::%s\n' "$CANWIN_TEST_SECRET_KEY"
          export CANWIN_TEST_FUNCTION_URL="${CANWIN_TEST_API_URL}/functions/v1/invite-member"
          {
            printf '%s\n' 'CANWIN_APP_ORIGINS=["http://127.0.0.1:4173"]'
            printf 'SUPABASE_PUBLISHABLE_KEYS=%s\n' "$(jq -cn --arg value "$CANWIN_TEST_PUBLISHABLE_KEY" '{primary:$value}')"
            printf 'SUPABASE_SECRET_KEYS=%s\n' "$(jq -cn --arg value "$CANWIN_TEST_SECRET_KEY" '{primary:$value}')"
          } >"$function_env"

          npx supabase functions serve --no-verify-jwt --env-file "$function_env" >"$edge_log" 2>&1 &
          edge_pid=$!

          edge_ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              -X OPTIONS \
              -H 'Origin: http://127.0.0.1:4173' \
              "$CANWIN_TEST_FUNCTION_URL" >/dev/null; then
              edge_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$edge_ready" != true ]]; then
            printf '%s\n' 'Local invite Edge Function did not become ready; raw output withheld because it may contain temporary credentials.' >&2
            exit 1
          fi

          npm run verify:auth:runtime

      - name: Verify contact access runtime
        shell: bash
        run: |
          set +x
          status_log="$RUNNER_TEMP/canwin-contact-status.log"
          cleanup_contact_status() {
            rm -f -- "$status_log"
          }
          trap cleanup_contact_status EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          install -m 600 /dev/null "$status_log"
          if ! status_json="$(npx supabase status -o json 2>"$status_log")"; then
            printf '%s\n' 'Local Supabase status failed; raw output withheld because it may contain temporary credentials.' >&2
            exit 1
          fi
          export CANWIN_TEST_API_URL="$(jq -r '.API_URL' <<<"$status_json")"
          export CANWIN_TEST_PUBLISHABLE_KEY="$(jq -r '.PUBLISHABLE_KEY' <<<"$status_json")"
          if ! read -r CANWIN_TEST_SECRET_KEY < <(jq -er '.SECRET_KEY' <<<"$status_json" 2>>"$status_log"); then
            printf '%s\n' 'Local Supabase credentials could not be read; raw output withheld.' >&2
            exit 1
          fi
          export CANWIN_TEST_SECRET_KEY
          printf '::add-mask::%s\n' "$CANWIN_TEST_SECRET_KEY"

          npm run verify:contacts:runtime

      - name: Verify audit, event, and observability runtime
        run: npm run verify:observability:runtime

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
