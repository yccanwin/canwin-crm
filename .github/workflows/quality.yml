name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Verify scaffold
        run: npm run verify:scaffold

      - name: Verify environment contract
        run: npm run verify:env

      - name: Verify Supabase baseline
        run: npm run verify:supabase

      - name: Verify Auth and membership contract
        run: npm run verify:auth

      - name: Start local Supabase
        run: npx supabase start

      - name: Test database policies and Auth contract
        run: npx supabase test db --local

      - name: Verify real Auth sessions
        shell: bash
        run: |
          status_json="$(npx supabase status -o json)"
          export CANWIN_TEST_API_URL="$(jq -r '.API_URL' <<<"$status_json")"
          export CANWIN_TEST_PUBLISHABLE_KEY="$(jq -r '.PUBLISHABLE_KEY' <<<"$status_json")"
          read -r CANWIN_TEST_SECRET_KEY < <(jq -r '.SECRET_KEY' <<<"$status_json")
          export CANWIN_TEST_SECRET_KEY
          export CANWIN_TEST_FUNCTION_URL="${CANWIN_TEST_API_URL}/functions/v1/invite-member"

          edge_log="$RUNNER_TEMP/canwin-edge.log"
          npx supabase functions serve --no-verify-jwt >"$edge_log" 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT

          edge_ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              -X OPTIONS \
              -H 'Origin: http://127.0.0.1:4173' \
              "$CANWIN_TEST_FUNCTION_URL" >/dev/null; then
              edge_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$edge_ready" != true ]]; then
            tail -n 80 "$edge_log"
            exit 1
          fi

          npm run verify:auth:runtime

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
